<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>青行 · 城市绿色出行积分平台</title><meta name="description" content="城市绿色出行积分平台"><link rel="stylesheet" href="/assets/style.css?v=1.3.0"></head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">✳</div><div><strong>青行 GreenGo</strong><small>城市绿色出行平台</small></div></div>
    <div class="section-label">工作空间</div>
    <nav class="side-nav" id="nav"></nav>
    <div class="sidebar-bottom"><div class="eco-illustration"><span>♻</span><b>每一次绿色出行<br>都值得被看见。</b><small>用积分记录低碳生活</small></div><div class="sys-note"><span class="online-dot"></span> 服务已连接</div></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="crumb"><button class="hamburger" id="mobile-menu" aria-label="菜单">☰</button><span>GreenGo</span><span class="slash">/</span><strong id="crumb-title">我的概览</strong></div><div class="top-right"><span class="date" id="today"></span><span class="avatar" id="top-avatar">G</span><span class="top-name" id="top-name">访客</span><button id="logout" class="text-button" hidden>退出</button></div></header>
    <div class="content">
      <section class="login-page" id="login-page">
        <div class="login-copy"><div class="eyebrow">GREEN MOBILITY REWARDS</div><h1>让每一段路程，<br><span>都为城市添一抹绿。</span></h1><p>记录低碳出行，查看减排估算，获得绿色积分并兑换商城商品。</p><div class="mini-feature"><span>◉ 可核对的减排估算</span><span>◉ 可追溯积分账本</span><span>◉ 商户运营清算</span></div></div>
        <div class="login-card">
          <div class="card-heading"><div><div class="eyebrow" id="auth-eyebrow">WELCOME BACK</div><h2 id="auth-title">登录青行</h2><p id="auth-subtitle">请输入用户名和密码</p></div><div class="login-leaf">✳</div></div>
          <div class="auth-tabs"><button type="button" class="auth-tab active" data-auth="login">登录</button><button type="button" class="auth-tab" data-auth="register">注册</button></div>
          <form id="login-form" autocomplete="off">
            <label for="username">用户名</label><input id="username" name="username" required>
            <label for="password">密码</label><input id="password" name="password" type="password" required>
            <button type="submit" class="primary block">登录系统 <span>↗</span></button>
          </form>
          <form id="register-form" hidden>
            <label for="register-username">用户名</label><input id="register-username" name="username" autocomplete="username" pattern="[a-zA-Z0-9_]+" minlength="3" maxlength="48" required>
            <label for="register-password">密码</label><input id="register-password" name="password" autocomplete="new-password" type="password" minlength="8" maxlength="128" required>
            <button type="submit" class="primary block">创建居民账户 <span>↗</span></button>
          </form>
        </div>
      </section>
      <div id="dashboard" class="page" hidden></div>
      <div id="journey" class="page" hidden></div>
      <div id="mall" class="page" hidden></div>
      <div id="wallet" class="page" hidden></div>
      <div id="orders" class="page" hidden></div>
      <div id="support" class="page" hidden></div>
      <div id="assistant" class="page" hidden></div>
      <div id="merchant" class="page" hidden></div>
      <div id="admin" class="page" hidden></div>
      <div id="accounts" class="page" hidden></div>
      <footer class="footer">GREEN GO © 2026 · 减排量按平台规则估算，结果不用于官方碳核证。</footer>
    </div>
  </main>
</div>
<dialog id="form-dialog" class="form-dialog"></dialog>
<dialog id="category-dialog" class="form-dialog"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/assets/app.js?v=1.3.0"></script><script src="/assets/support-ai.js?v=1.3.0"></script></body></html>
