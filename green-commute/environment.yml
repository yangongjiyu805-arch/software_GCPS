# GreenGo 教学演示环境：全部命令在 Anaconda Prompt 执行。
# 使用：conda env create -f environment.yml
name: greengo
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - "fastapi>=0.115,<1"
      - "uvicorn>=0.30,<1"
      - "sqlalchemy>=2.0,<3"
      - "PyJWT>=2.8,<3"
      - "pydantic>=2,<3"
      - "pytest>=8,<10"
      - "httpx>=0.27,<1"
      - "requests>=2.31,<3"
      - "python-docx>=1.1,<2"
